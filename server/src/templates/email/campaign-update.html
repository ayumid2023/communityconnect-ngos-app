<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; line-height: 1.6; color: #333; max-width: 600px; margin: 0 auto; padding: 20px; }
    .header { background: #2563eb; color: white; padding: 20px; text-align: center; border-radius: 8px 8px 0 0; }
    .content { background: #f8fafc; padding: 30px; border-radius: 0 0 8px 8px; border: 1px solid #e2e8f0; border-top: none; }
    .progress { background: white; padding: 20px; border-radius: 8px; margin: 20px 0; text-align: center; }
    .progress-bar { width: 100%; background: #e2e8f0; border-radius: 10px; height: 20px; overflow: hidden; margin: 10px 0; }
    .progress-fill { height: 100%; background: linear-gradient(90deg, #2563eb, #3b82f6); border-radius: 10px; transition: width 0.5s; }
    .amount { font-size: 32px; font-weight: bold; color: #2563eb; }
    .footer { text-align: center; color: #94a3b8; font-size: 14px; margin-top: 30px; }
  </style>
</head>
<body>
  <div class="header">
    <h1>{{campaignName}} - Update</h1>
  </div>
  <div class="content">
    <p>Hello {{name}},</p>
    <p>Here's the latest update on the <strong>{{campaignName}}</strong> campaign:</p>
    
    <div class="progress">
      <div class="amount">{{currency}} {{raised}}</div>
      <p>raised of {{currency}} {{goal}} goal</p>
      <div class="progress-bar">
        <div class="progress-fill" style="width: {{progress}}%;"></div>
      </div>
      <p>{{progress}}% complete</p>
    </div>
    
    <p>{{description}}</p>
    
    <p>Thank you for your support!</p>
  </div>
  <div class="footer">
    <p>&copy; 2026 CommunityConnect. All rights reserved.</p>
  </div>
</body>
</html>
